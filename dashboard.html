<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --ink: #1b2430;
      --muted: #5d6b7e;
      --accent: #1f5eff;
      --line: #dde3ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    nav {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    nav strong { margin-right: auto; padding: 16px 0; }
    nav a {
      color: var(--muted);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
    }
    nav a:hover, nav a:focus-visible { color: var(--accent); background: #eef2ff; outline: none; }
    nav a.ativo { color: var(--accent); font-weight: 600; }
    main { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: var(--muted); line-height: 1.6; max-width: 60ch; }
    .sair {
      margin-top: 24px;
      padding: 10px 18px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .sair:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Menu principal">
      <strong>Meu Sistema</strong>
      <a href="dashboard.html" class="ativo">Início</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="index.html" id="linkSair">Sair</a>
    </nav>
  </header>

  <main>
    <h1 id="boasVindas">Bem-vindo(a)!</h1>
    <p>Você está autenticado. Use o menu acima para navegar pelo sistema.</p>
    <button class="sair" id="btnSair" type="button">Sair da conta</button>
  </main>

  <script>
    // Lê o usuário salvo no login (se existir)
    var usuario = "";
    try { usuario = sessionStorage.getItem("usuario") || ""; } catch (e) {}

    if (usuario) {
      document.getElementById("boasVindas").textContent = "Bem-vindo(a), " + usuario + "!";
    }

    function sair(evento) {
      if (evento) evento.preventDefault();
      try { sessionStorage.removeItem("usuario"); } catch (e) {}
      window.location.href = "index.html";
    }

    document.getElementById("btnSair").addEventListener("click", sair);
    document.getElementById("linkSair").addEventListener("click", sair);
  </script>
</body>
</html>
